name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build and sign Release APK'
        required: false
        type: boolean
        default: false
      verify_drift:
        description: 'Run native prebuild drift verification check'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. QUALITY GATE: Fail-fast checks before launching expensive Gradle build
  # =========================================================================
  quality-gate:
    name: Fail-Fast Quality Gate (Typecheck & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 📦 Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📊 pnpm Cache Status Report
        run: |
          echo "pnpm Store Cache: ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo "### ⚡ Quality Gate Cache" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm Store Cache:** ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🔍 TypeScript static type check
        run: pnpm tsc --noEmit

      - name: 🧹 Lint check (if configured)
        run: pnpm run --if-present lint

  # =========================================================================
  # 2. DEBUG APK BUILD: Runs on push, PR, and workflow_dispatch
  # =========================================================================
  build-debug-apk:
    name: Build Android Debug APK (arm64-v8a)
    needs: [quality-gate]
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_MQTT_PASSWORD: ${{ secrets.EXPO_PUBLIC_MQTT_PASSWORD }}
      EXPO_PUBLIC_MQTT_USERNAME: ${{ secrets.EXPO_PUBLIC_MQTT_USERNAME }}
      EXPO_PUBLIC_MQTT_BROKER_URL: ${{ secrets.EXPO_PUBLIC_MQTT_BROKER_URL }}
      # Restrict CI compilation to arm64-v8a to cut build time by ~70% without affecting local x86_64 emulator dev
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Build Traceability Identifiers
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 📦 Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 📦 Install Pinned NDK (27.1.12297006)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: 🐘 Cache Gradle dependencies, wrapper & build cache
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📊 Cache Status Report
        run: |
          echo "================ CACHE STATUS REPORT ================"
          echo "pnpm Store Cache: ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo "Gradle Cache:     ${{ steps.gradle-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo "Target ABI:       $ORG_GRADLE_PROJECT_reactNativeArchitectures"
          echo "====================================================="
          echo "### 🚀 CI Cache & Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Architecture:** \`arm64-v8a\` (Tablet Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm Store Cache:** ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Cache:** ${{ steps.gradle-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: ⚙️ Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Traceable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-hakeem-debug-${{ steps.meta.outputs.sha_short }}-${{ steps.meta.outputs.timestamp }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. RELEASE APK BUILD: Gated to version tags (v*.*.*) or manual dispatch
  # =========================================================================
  build-release-apk:
    name: Build Android Release APK (arm64-v8a)
    needs: [quality-gate]
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_MQTT_PASSWORD: ${{ secrets.EXPO_PUBLIC_MQTT_PASSWORD }}
      EXPO_PUBLIC_MQTT_USERNAME: ${{ secrets.EXPO_PUBLIC_MQTT_USERNAME }}
      EXPO_PUBLIC_MQTT_BROKER_URL: ${{ secrets.EXPO_PUBLIC_MQTT_BROKER_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🏷️ Generate Build Traceability Identifiers
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Get pnpm store directory
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 📦 Cache pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 📦 Install Pinned NDK (27.1.12297006)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: 🐘 Cache Gradle dependencies, wrapper & build cache
        id: gradle-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📊 Cache Status Report
        run: |
          echo "================ CACHE STATUS REPORT ================"
          echo "pnpm Store Cache: ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo "Gradle Cache:     ${{ steps.gradle-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}"
          echo "Target ABI:       $ORG_GRADLE_PROJECT_reactNativeArchitectures"
          echo "====================================================="
          echo "### 🚀 CI Cache & Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Architecture:** \`arm64-v8a\` (Tablet Optimized)" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm Store Cache:** ${{ steps.pnpm-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Cache:** ${{ steps.gradle-cache.outputs.cache-hit == 'true' && '✅ HIT' || '❌ MISS' }}" >> $GITHUB_STEP_SUMMARY

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🔑 Decode Android Release Keystore
        if: env.ANDROID_KEYSTORE_PASSWORD != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: ⚙️ Grant execute permission for Gradle wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 📤 Upload Traceable Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dr-hakeem-release-unsigned-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # =========================================================================
  # 4. NATIVE INTEGRITY CHECK: Catch drift between withUsbCamera plugin & android/
  # =========================================================================
  verify-prebuild-drift:
    name: Verify Native Config Plugin Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.verify_drift == true
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: 🔄 Test Prebuild Clean and Diff Manifest
        run: |
          echo "Verifying committed Android Manifest has USB Host and UVC declarations..."
          grep "android.hardware.usb.host" android/app/src/main/AndroidManifest.xml
          grep "USB_DEVICE_ATTACHED" android/app/src/main/AndroidManifest.xml
          grep "device_filter" android/app/src/main/AndroidManifest.xml
          echo "Native manifest integrity verified successfully."
